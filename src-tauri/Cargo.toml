[package]
name = "bloodborne-launcher"
default-run = "bloodborne-launcher"
version = "0.9.3"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Launcher for bloodborne_mac"

# The app as a library: desktop's main.rs and the iOS/Android projects (src-tauri/gen) call run().
[lib]
name = "bloodborne_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tokio = { version = "1", features = ["time"] }
texture2ddecoder = "0.1"
png = "0.17"
base64 = "0.22"

# Desktop only: the tray and one launcher at a time.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
