[package]
name = "bloodborne-launcher"
default-run = "bloodborne-launcher"
version = "0.8.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Launcher for bloodborne_mac"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSApplication", "NSResponder"] }
objc2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"

[profile.release]
opt-level = "s"
lto = true
strip = true
